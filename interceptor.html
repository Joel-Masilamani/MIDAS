    body {
      font-family: 'Share Tech Mono', monospace;
      background-color: #0b1e2d;
      color: #00eaff;
      margin: 0;
      padding: 0;
    }

    #notification-wrapper {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 340px;
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
      gap: 12px;
      z-index: 1000;
    }

    .notification {
      background-color: rgba(0, 0, 0, 0.15);
      color: #00eaff;
      border: 1px solid #00eaff;
      border-radius: 6px;
      padding: 15px 20px;
      box-shadow: 0 0 10px rgba(0, 234, 255, 0.2);
    }

    .notification-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .notification-message {
      font-size: 13px;
      white-space: normal;
      word-wrap: break-word;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .intercept-btn {
      background-color: transparent;
      color: #00eaff;
      border: 1px solid #00eaff;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .intercept-btn:hover {
      background-color: #00eaff;
      color: #0b1e2d;
    }

  </style>
</head>
<body>

  <div id="notification-wrapper"></div>

  <script>
    const wrapper = document.getElementById('notification-wrapper');

    function showNotification({ title, message }) {
      const notif = document.createElement('div');
      notif.classList.add('notification');

      notif.innerHTML = `
        <div class="notification-title">${title}</div>
        <div class="notification-message">${message}</div>
        <button class="intercept-btn">Intercepted</button>
      `;

      notif.querySelector('.intercept-btn').addEventListener('click', () => {
        notif.remove();
      });

      wrapper.appendChild(notif);
    }

    function formatNotificationText(missileData, index) {
      const attempt = missileData.interception_result;
      const coords = attempt.interception_point;
      const interceptorTime = attempt.interceptor_time.toFixed(2);
      const missileTime = attempt.missile_time.toFixed(2);
      const prob = (attempt.success_probability * 100).toFixed(1);
      const outcome = attempt.success ? "✔️" : "❌";

      const title = `INTERCEPT – ${attempt.base.name.toUpperCase()} – MISSILE #${missileData.missile_id}`;
      const message = `@ ${coords[0]}, ${coords[1]} | I: ${interceptorTime}s | M: ${missileTime}s | P: ${prob}% | ${outcome}`;
      return { title, message };
    }

    function createAllNotifications(data) {
      data.forEach((missileData, index) => {
        const { title, message } = formatNotificationText(missileData, index);
        setTimeout(() => {
          showNotification({ title, message });
        }, index * 600);
      });
    }
